name: Build and deploy dashboard

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay scheduled runs when Actions is busy.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Check generated site
        run: |
          test -s site/index.html
          grep -q "APPROXIMATION" site/index.html
          grep -q "cdn.plot.ly/plotly" site/index.html
          grep -q "http-equiv=\"refresh\" content=\"300\"" site/index.html

      - name: Commit floor history
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/floor_history.csv
          if git diff --cached --quiet; then
            echo "Floor history unchanged."
            exit 0
          fi
          git commit -m "chore: record live floor [skip ci]"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
