name: Build and deploy dashboard

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay scheduled runs when Actions is busy.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        id: build_dash
        continue-on-error: true
        run: python build_dashboard.py

      - name: Check generated site
        if: steps.build_dash.outcome == 'success'
        continue-on-error: true
        run: |
          test -s site/index.html
          grep -q "APPROXIMATION" site/index.html
          grep -q "cdn.plot.ly/plotly" site/index.html
          grep -q "http-equiv=\"refresh\" content=\"300\"" site/index.html

      - name: Commit floor history
        if: github.ref == 'refs/heads/main' && steps.build_dash.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/floor_history.csv
          if git diff --cached --quiet; then
            echo "Floor history unchanged."
            exit 0
          fi
          git commit -m "chore: record live floor [skip ci]"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

      - name: Fallback site if dashboard build failed
        if: steps.build_dash.outcome != 'success' || hashFiles('site/index.html') == ''
        run: |
          mkdir -p site
          if [ ! -s site/index.html ]; then
            cat > site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=vault/">
          <title>Shielded Nakas</title></head>
          <body style="background:#0d0b09;color:#f3ead6;font-family:sans-serif">
          <p>Charts dashboard temporarily unavailable (data source error). Opening <a href="vault/" style="color:#f26a1b">The Vault</a>…</p>
          </body></html>
          HTML
            echo "::warning::build_dashboard.py failed; deployed fallback index redirecting to vault/"
          fi

      - name: Include The Vault
        run: |
          mkdir -p site/vault
          cp -r vault/. site/vault/
          rm -f site/vault/*.png

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
